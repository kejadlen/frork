# Excludes for cargo-mutants — equivalent or unreachable mutations.
# Add entries as false positives are discovered.

exclude_re = [
    # Unimplemented update stubs — nothing calls them in tests, so replacing
    # the todo!() with Ok(()) cannot be observed. Drop an entry when that
    # provider's update is implemented, at the same point its cov-excl markers
    # in assertions.rs go. remove still defaults on the trait.
    "impl Provider for Symlink>::update",
    "impl Provider for Directory>::update",
    "impl Provider for Git>::update",
    "impl Provider for Brew<R>>::update",
    "impl Provider for BrewBundle<R>>::update",
    "impl Provider for Debug>::update",
    "Provider::remove",

    # BrewBundle's status and create exist twice, split on
    # #[cfg(target_os = "macos")]. cargo-mutants cannot tell which half is
    # compiled, so it always reports the inactive one as missed.
    "impl Provider for BrewBundle<R>>::status",
    "impl Provider for BrewBundle<R>>::create",
]

# main.rs is I/O only — argument parsing, println!, and the stdin prompt.
# "Function does nothing" cannot be caught there without capturing stdout, so
# it is excluded here the same way bin/coverage ignores it. Anything with a
# decision in it belongs in a library module instead; report.rs holds the
# wording and the prompt parsing for exactly this reason.
exclude_globs = ["frork-cli/src/bin/**"]

[package]
name = "frork-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "frork"
path = "src/bin/frork/main.rs"

[dependencies]
frork-lib = { path = "../frork-lib" }
miette = { version = "*", features = ["fancy"] }
clap = { version = "*", features = ["derive", "env"] }
clap_complete = "*"
# Not used directly: links a vendored Lua for frork-lib's engine.
mlua = { version = "*", features = ["lua54", "vendored"] }
tracing-subscriber = { version = "*", features = ["env-filter"] }
xdg = "*"

[dev-dependencies]
assert_cmd = "*"
predicates = "*"

[lints]
workspace = true

name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

env:
  # workflow_run checks out the default branch head by default, which may have
  # moved past the commit CI actually validated.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    permissions:
      contents: write # create GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Calculate version
        id: version
        run: |
          CALVER=$(date -u +"%Y-%m-%d")
          echo "version=${CALVER}+${RELEASE_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          FRORK_VERSION="${STEPS_VERSION_OUTPUTS_VERSION}" cargo build --release -p frork-cli
          tar -czf frork-aarch64-apple-darwin.tar.gz -C target/release frork
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "${RELEASE_SHA}" \
            frork-aarch64-apple-darwin.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

  dotslash:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Generate DotSlash file
        uses: facebook/dotslash-publish-release@9c9ec027515c34db9282a09a25a9cab5880b2c52 # v2
        with:
          config: .github/dotslash-config.json
          tag: v${{ needs.build.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sdk:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      LUA_VERSION: 5.4.8
      TARGETS: >-
        aarch64-apple-darwin x86_64-apple-darwin
        aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      # The SDKs `frork compile` downloads to link a script for each target.
      - name: Build SDKs
        run: |
          # shellcheck disable=SC2086 # TARGETS is a word list
          rustup target add $TARGETS && rustup component add llvm-tools
          curl -sSfL "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" | tar xz
          export LUA_SRC="$PWD/lua-${LUA_VERSION}/src"
          for target in $TARGETS; do
            bin/build-sdk "$target" "frork-sdk-$target.tar.gz"
          done

      - name: Publish
        run: gh release upload "v${VERSION}" frork-sdk-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}

name: Standalone

# Builds a standalone binary on Linux for both Linux and macOS, then runs each
# on its own platform. The macOS runtime is cross-compiled with zig, so no Mac
# is involved until the binary is run.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin
      - run: pip install ziglang && cargo install --locked cargo-zigbuild
      - name: Build runtimes
        run: |
          export PATH="$PATH:$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')"
          cargo build --release -p frork-cli
          cargo zigbuild --release -p frork-cli --target aarch64-apple-darwin
      - name: Embed the example script
        run: |
          mkdir dist
          frork=target/release/frork
          $frork build examples/standalone/main.fnl -o dist/demo-linux
          $frork build examples/standalone/main.fnl -o dist/demo-macos \
            --runtime target/aarch64-apple-darwin/release/frork
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: dist

  run:
    needs: build
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, exe: demo-linux }
          - { os: macos-latest, exe: demo-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo
      - name: Satisfy, then check everything is ok
        run: |
          chmod +x "./${MATRIX_EXE}"
          export FRORK_DEMO_ROOT="$RUNNER_TEMP/demo"
          "./${MATRIX_EXE}" --satisfy
          "./${MATRIX_EXE}" | tee status.txt
          ! grep missing status.txt
          test -L "$FRORK_DEMO_ROOT/settings.txt"
          cat "$FRORK_DEMO_ROOT/settings.txt"
        env:
          MATRIX_EXE: ${{ matrix.exe }}

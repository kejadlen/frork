name: Standalone

# Compiles the example script with `fennel --compile-binary` for Linux and
# macOS on one Linux runner (zig cross-compiles), then runs each binary on
# its own platform.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  LUA_VERSION: 5.4.8
  FENNEL_VERSION: 1.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin && rustup component add llvm-tools
      - run: sudo apt-get install -y lua5.4 && pip install ziglang
      - name: Fetch Lua sources and the Fennel CLI
        run: |
          curl -sSfL "https://www.lua.org/ftp/lua-${LUA_VERSION}.tar.gz" | tar xz
          git clone --depth 1 --branch "${FENNEL_VERSION}" https://github.com/bakpakin/Fennel fennel
          make -C fennel LUA=lua5.4 fennel
      - name: Compile the example
        run: |
          export PATH="$PATH:$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')"
          export FENNEL="$PWD/fennel/fennel" LUA_SRC="$PWD/lua-${LUA_VERSION}/src"
          mkdir dist
          bin/compile-binary x86_64-unknown-linux-gnu examples/standalone/main.fnl dist/demo-linux
          bin/compile-binary aarch64-apple-darwin examples/standalone/main.fnl dist/demo-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: dist

  run:
    needs: build
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, exe: demo-linux }
          - { os: macos-latest, exe: demo-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo
      - name: Satisfy, then check everything is ok
        run: |
          chmod +x "./${MATRIX_EXE}"
          export FRORK_DEMO_ROOT="$RUNNER_TEMP/demo"
          "./${MATRIX_EXE}" --satisfy
          "./${MATRIX_EXE}" | tee status.txt
          ! grep missing status.txt
          test -L "$FRORK_DEMO_ROOT/settings.txt"
          cat "$FRORK_DEMO_ROOT/settings.txt"
        env:
          MATRIX_EXE: ${{ matrix.exe }}
